[tools]
  "github:PataphysicalSociety/soupault" = "5.3.0"
  minify = "2.24.13"
  typst = "0.11.1"

[tasks.clean]
description = "Remove build contents"
run = "rm -rf build/*"

[tasks.build]
description = "Build the site with soupault"
depends = ["clean"]
run = "soupault"

[tasks.serve]
description = "Serve the site locally"
depends = ["build"]
run = "python -m http.server 8080 --directory build/ --bind 127.0.0.1"

[tasks.new-post]
description = "Create a new blog post"
run = "scripts/new-post.sh \"{{arg(name='title')}}\""

[tasks.resume]
description = "Compile resume PDF (use --phone=XXX to include phone number)"
run = """
if [ -n "{{option(name='phone', default='')}}" ]; then
  typst compile site/resume.typ resume.pdf --input "phone={{option(name='phone')}}"
else
  typst compile site/resume.typ resume.pdf
fi
"""

[tasks.lighthouse]
description = "Run Lighthouse audit against the built site"
depends = ["build"]
run = """
python3 -m http.server 10080 --directory build/ --bind 127.0.0.1 &
SERVER_PID=$!
sleep 1
npx lighthouse http://127.0.0.1:10080 \
  --chrome-flags="--headless=new --no-sandbox" \
  --output=html --output-path=./lighthouse-report.html \
  --only-categories=seo,accessibility
EXIT_CODE=$?
kill $SERVER_PID 2>/dev/null
exit $EXIT_CODE
"""
